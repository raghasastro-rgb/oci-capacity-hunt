# Hunts for Oracle Cloud Always Free ARM capacity and launches the instance the
# moment some appears.
#
# It lives in a public repository for one reason: GitHub bills Actions minutes
# on private repositories, and a round-the-clock hunt would eat a month's free
# quota in days. Nothing of the application is here — only this workflow. The
# Oracle credentials are repository secrets, which fork pull requests cannot
# read, and this workflow never runs on pull_request anyway.
name: capacity hunt

on:
  schedule:
    # Kept as a hopeful backup, not as the mechanism. GitHub has never delivered
    # a schedule event to this repository — not on '*/10', not on this offset,
    # not once across an hour and a half of boundaries, with the workflow active
    # on the default branch and nothing queued or pending. The hunt therefore
    # does its own timing inside one long job (see below) and this line is free
    # extra coverage if delivery ever starts. An overlapping run is harmless:
    # the concurrency group serialises it and hunt.sh refuses to create a second
    # instance.
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:

# Least privilege: enough to open the issue that tells the owner it worked, and
# to switch this workflow off afterwards.
permissions:
  issues: write
  actions: write

concurrency:
  # Two launches racing would create two instances and blow the Always Free
  # allowance. One hunt at a time, and a late run is dropped rather than queued.
  group: capacity-hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    # A public repository gets unlimited free Actions minutes, so the cheapest
    # clock that GitHub cannot drop is a job that stays alive and keeps asking.
    # Just under the six-hour ceiling on a hosted job.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Install the OCI CLI
        run: pip install --quiet oci-cli

      - name: Hunt for capacity until the job runs out of time
        id: hunt
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          COMPARTMENT: ${{ secrets.OCI_COMPARTMENT }}
          SUBNET: ${{ secrets.OCI_SUBNET }}
          IMAGE: ${{ secrets.OCI_IMAGE }}
          AD: ${{ secrets.OCI_AD }}
          SSH_KEY: ${{ secrets.INSTANCE_SSH_KEY }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # One attempt every ten minutes until Oracle says yes or the job is
          # killed. Each attempt writes its outputs to a scratch file and only a
          # terminal result is promoted to the step's real outputs, so the steps
          # below see exactly one result rather than a stack of refusals. The
          # shape counter advances per attempt, which is what alternates
          # 2 OCPU / 12 GB with 1 OCPU / 6 GB inside a single run.
          real_output="$GITHUB_OUTPUT"
          while :; do
            attempt=$(mktemp)
            GITHUB_OUTPUT="$attempt" ./hunt.sh
            RUN_NUMBER=$((RUN_NUMBER + 1))
            case "$(sed -n 's/^result=//p' "$attempt" | tail -1)" in
              created|exists)
                cat "$attempt" >> "$real_output"
                exit 0
                ;;
            esac
            rm -f "$attempt"
            sleep 600
          done

      - name: Announce the instance
        if: steps.hunt.outputs.result == 'created'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Instance is up — ${{ steps.hunt.outputs.ip }}" \
            --body "$(printf 'Oracle finally had capacity.\n\n- **IP**: %s\n- **Shape**: %s\n- **OCID**: %s\n\nConnect with:\n\n```\nssh ubuntu@%s\n```\n\nThe hunt has switched itself off.\n' \
              "${{ steps.hunt.outputs.ip }}" "${{ steps.hunt.outputs.shape }}" "${{ steps.hunt.outputs.ocid }}" "${{ steps.hunt.outputs.ip }}")"

      - name: Stop hunting
        if: steps.hunt.outputs.result == 'created' || steps.hunt.outputs.result == 'exists'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable "capacity hunt" || true
